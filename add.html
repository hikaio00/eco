<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Добавить вид</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Добавление вида растения или животного</h1>
        <a href="index.html" class="nav-btn">⬅ Назад к карте</a>
    </header>

    <main class="form-container">
        <form id="add-form">
            <label>Название вида:
                <input type="text" id="title" required placeholder="Например: Дубовый усач">
            </label>

            <label>Описание:
                <textarea id="description" required placeholder="Введите описание..."></textarea>
            </label>

            <label>Ссылка на фото (URL):
                <input type="url" id="image" placeholder="https://site.com/image.jpg">
            </label>

            <label>Широта (Latitude):
                <input type="number" step="any" id="lat" required placeholder="55.7512">
            </label>

            <label>Долгота (Longitude):
                <input type="number" step="any" id="lng" required placeholder="37.6184">
            </label>

            <button type="submit" class="submit-btn">Сохранить на карту</button>
        </form>
    </main>

    <script src="add.js"></script>
</body>
</html>
